<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#08080f" />
  <title>Newest Sale!</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #08080f;
    }

    body {
      position: fixed;
      inset: 0;
      color: #fff;
      font-family: Inter, "Segoe UI", Arial, "Liberation Sans", Helvetica, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      background-color: #08080f;
      background-image: radial-gradient(ellipse 90% 42% at 50% 118%, rgba(92, 58, 18, 0.38), transparent 68%);
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 0;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(
        ellipse 50% 48% at 50% 48%,
        rgba(8, 8, 15, 0.82) 0%,
        rgba(8, 8, 15, 0.42) 46%,
        rgba(8, 8, 15, 0.08) 68%,
        rgba(8, 8, 15, 0) 78%
      );
    }

    main {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6vh 4vw 8vh;
      pointer-events: none;
      transform: translateY(-1.5vh);
    }

    .label {
      margin: 0;
      font-size: clamp(12px, min(1.55vw, 2.5vh), 42px);
      font-weight: 600;
      letter-spacing: 0.34em;
      padding-left: 0.34em;
      text-transform: uppercase;
      color: rgba(255, 226, 176, 0.9);
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.7);
    }

    .label::after {
      content: "";
      display: block;
      width: clamp(56px, 9vw, 168px);
      height: 2px;
      margin: 1.6vh auto 0;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, rgba(255, 197, 51, 0.95), transparent);
    }

    #rep {
      margin: 2.2vh 0 0;
      max-width: 68vw;
      font-size: clamp(28px, min(7.4vw, 13vh), 240px);
      font-weight: 700;
      line-height: 0.98;
      letter-spacing: -0.03em;
      color: #fff;
      text-wrap: balance;
      text-shadow:
        0 2px 18px rgba(0, 0, 0, 0.8),
        0 0 42px rgba(0, 0, 0, 0.45);
    }

    #amount {
      margin: 1.4vh 0 0;
      max-width: 90vw;
      font-size: clamp(40px, min(13vw, 22vh), 420px);
      font-weight: 700;
      line-height: 0.92;
      letter-spacing: -0.035em;
      font-variant-numeric: tabular-nums;
      color: #ffc533;
      white-space: nowrap;
      text-shadow:
        0 0 22px rgba(255, 197, 51, 0.38),
        0 0 64px rgba(255, 160, 30, 0.22),
        0 8px 28px rgba(0, 0, 0, 0.65);
    }

    .pop {
      animation: pop 680ms cubic-bezier(0.16, 0.84, 0.32, 1);
    }

    @keyframes pop {
      from { opacity: 0; transform: translateY(1.6vh) scale(0.965); }
      to { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <main>
    <p class="label">New Sale Just Landed</p>
    <div id="sale" aria-live="polite">
      <h1 id="rep"></h1>
      <p id="amount"></p>
    </div>
  </main>
  <script>
    (function () {
      var canvas = document.getElementById("sky");
      var ctx = canvas.getContext("2d", { alpha: true });
      var repEl = document.getElementById("rep");
      var amountEl = document.getElementById("amount");

      var POLL_MS = 60 * 1000;
      var RELOAD_MS = 30 * 60 * 1000;
      var MAX_PARTICLES = 1600;

      var W = 0;
      var H = 0;
      var dpr = 1;
      var rockets = [];
      var particles = [];
      var flashes = [];
      var shown = null;
      var requestId = 0;
      var controller = null;
      var last = performance.now();
      var step = 1;
      var nextSpawn = last + 400;
      var launchLeft = false;

      function rand(min, max) {
        return min + Math.random() * (max - min);
      }

      function scale() {
        return Math.max(0.65, Math.min(1.85, Math.min(W, H) / 1000));
      }

      function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
      }

      function pickHue() {
        var roll = Math.random();
        if (roll < 0.34) return rand(36, 50);
        if (roll < 0.48) return rand(14, 28);
        if (roll < 0.62) return rand(330, 352);
        if (roll < 0.76) return rand(186, 206);
        if (roll < 0.88) return rand(268, 292);
        return rand(142, 162);
      }

      function addParticle(p) {
        if (particles.length >= MAX_PARTICLES) return;
        particles.push(p);
      }

      function burst(x, y, hue, big) {
        var s = scale();
        var count = big ? 104 : 72;
        var i;
        var angle;
        var speed;
        for (i = 0; i < count; i++) {
          angle = (Math.PI * 2 * i) / count + rand(-0.08, 0.08);
          speed = (Math.random() < 0.2 ? rand(2.5, 3.15) : rand(0.35, 3.15)) * s;
          addParticle({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: rand(0.78, 1),
            decay: rand(0.0062, 0.011),
            size: rand(1.25, 2.35) * s,
            hue: hue + rand(-14, 14),
            lit: Math.random() < 0.16 ? 94 : rand(58, 74),
            gravity: 0.032 * s,
            drag: rand(0.978, 0.988),
            streak: rand(2.4, 4.4)
          });
        }
        for (i = 0; i < (big ? 22 : 12); i++) {
          angle = rand(0, Math.PI * 2);
          speed = rand(0.15, 1.5) * s;
          addParticle({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: rand(0.35, 0.65),
            decay: rand(0.02, 0.034),
            size: rand(1.3, 2.1) * s,
            hue: 46,
            lit: 96,
            gravity: 0.012 * s,
            drag: 0.96,
            streak: 1.4
          });
        }
        flashes.push({
          x: x,
          y: y,
          hue: hue,
          life: 1,
          maxR: (big ? 78 : 46) * s
        });
      }

      function launch(left, big) {
        var xBand = 0.045 + Math.random() * 0.1;
        var tx = (left ? xBand : 1 - xBand) * W;
        var ty = (0.08 + Math.random() * 0.7) * H;
        rockets.push({
          x: Math.min(W - 8, Math.max(8, tx + rand(-W * 0.03, W * 0.03))),
          y: H + 8,
          tx: tx,
          ty: ty,
          hue: pickHue(),
          big: !!big,
          speed: Math.max(9, H * 0.017)
        });
      }

      function updateRockets() {
        var i, r, dx, dy, dist, move;
        for (i = rockets.length - 1; i >= 0; i--) {
          r = rockets[i];
          dx = r.tx - r.x;
          dy = r.ty - r.y;
          dist = Math.hypot(dx, dy);
          move = r.speed * step;
          if (dist <= move) {
            burst(r.tx, r.ty, r.hue, r.big);
            if (r.big) {
              (function (x, y, hue) {
                setTimeout(function () { burst(x, y, (hue + 36) % 360, false); }, 170);
              })(r.tx, r.ty, r.hue);
            }
            rockets.splice(i, 1);
            continue;
          }
          r.x += (dx / dist) * move;
          r.y += (dy / dist) * move;
          addParticle({
            x: r.x,
            y: r.y,
            vx: rand(-0.22, 0.22),
            vy: rand(0.35, 1.25) * scale(),
            life: rand(0.4, 0.72),
            decay: rand(0.028, 0.046),
            size: rand(1.15, 1.9) * scale(),
            hue: r.hue,
            lit: rand(72, 92),
            gravity: 0.018 * scale(),
            drag: 0.97,
            streak: 2.1
          });
        }
      }

      function updateParticles() {
        var write = 0;
        var i, p;
        for (i = 0; i < particles.length; i++) {
          p = particles[i];
          p.vx *= Math.pow(p.drag, step);
          p.vy *= Math.pow(p.drag, step);
          p.vy += p.gravity * step;
          p.x += p.vx * step;
          p.y += p.vy * step;
          p.life -= p.decay * step;
          if (p.life > 0) particles[write++] = p;
        }
        particles.length = write;
      }

      function draw() {
        var i, p, r, f, alpha, s;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, W, H);
        ctx.globalCompositeOperation = "lighter";
        ctx.lineCap = "round";
        s = scale();

        for (i = 0; i < particles.length; i++) {
          p = particles[i];
          alpha = p.life < 0 ? 0 : p.life > 1 ? 1 : p.life;
          ctx.globalAlpha = alpha;
          ctx.strokeStyle = "hsl(" + p.hue + ", 96%, " + p.lit + "%)";
          ctx.lineWidth = Math.max(0.7, p.size * alpha);
          ctx.beginPath();
          ctx.moveTo(p.x - p.vx * p.streak, p.y - p.vy * p.streak);
          ctx.lineTo(p.x, p.y);
          ctx.stroke();
        }

        for (i = 0; i < rockets.length; i++) {
          r = rockets[i];
          ctx.globalAlpha = 1;
          ctx.fillStyle = "hsl(" + r.hue + ", 100%, 76%)";
          ctx.beginPath();
          ctx.arc(r.x, r.y, 2.6 * s, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#fff";
          ctx.beginPath();
          ctx.arc(r.x, r.y, 1.25 * s, 0, Math.PI * 2);
          ctx.fill();
        }

        for (i = flashes.length - 1; i >= 0; i--) {
          f = flashes[i];
          f.life -= 0.05 * step;
          if (f.life <= 0) {
            flashes.splice(i, 1);
            continue;
          }
          ctx.globalAlpha = f.life * 0.5;
          ctx.strokeStyle = "hsl(" + f.hue + ", 100%, 72%)";
          ctx.lineWidth = 2 * s;
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.maxR * (1.2 - f.life), 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
      }

      function tick(now) {
        var dtMs = Math.min(40, now - last);
        last = now;
        step = dtMs / 16.6667;
        if (W > 0 && H > 0) {
          if (now >= nextSpawn) {
            launchLeft = !launchLeft;
            launch(launchLeft, false);
            if (Math.random() < 0.4) launch(!launchLeft, false);
            nextSpawn = now + rand(380, 860);
          }
          updateRockets();
          updateParticles();
          draw();
        }
        requestAnimationFrame(tick);
      }

      function celebrate() {
        var i, leftSide, xBand, x, y;
        for (i = 0; i < 6; i++) {
          leftSide = i % 2 === 0;
          xBand = 0.05 + Math.random() * 0.1;
          x = (leftSide ? xBand : 1 - xBand) * W;
          y = (0.12 + Math.random() * 0.62) * H;
          burst(x, y, pickHue(), true);
        }
        for (i = 0; i < 8; i++) {
          (function (n) {
            setTimeout(function () { launch(n % 2 === 0, true); }, n * 110);
          })(i);
        }
      }

      function pop(el) {
        el.classList.remove("pop");
        void el.offsetWidth;
        el.classList.add("pop");
      }

      function render(rep, amount, animate) {
        repEl.textContent = rep;
        amountEl.textContent = amount;
        if (animate) {
          pop(repEl);
          pop(amountEl);
        }
      }

      async function loadSale() {
        var myId = ++requestId;
        var timeout;
        var res;
        var data;
        var changed;
        if (controller) controller.abort();
        controller = typeof AbortController === "function" ? new AbortController() : { abort: function () {}, signal: undefined };
        var ac = controller;
        timeout = setTimeout(function () { ac.abort(); }, 15000);
        try {
          res = await fetch("data.json?t=" + Date.now(), {
            cache: "no-store",
            signal: ac.signal
          });
          if (myId !== requestId || !res.ok) return;
          data = await res.json();
          if (myId !== requestId) return;
          if (!data || typeof data !== "object" || Array.isArray(data)) return;
          if (typeof data.rep !== "string" || typeof data.amount !== "string") return;
          changed = !!(shown && (data.rep !== shown.rep || data.amount !== shown.amount));
          shown = { rep: data.rep, amount: data.amount };
          render(data.rep, data.amount, changed);
          if (changed) celebrate();
        } catch (err) {
          /* Keep the last rep and amount on screen. */
        } finally {
          clearTimeout(timeout);
        }
      }

      resize();
      window.addEventListener("resize", resize);
      launch(true, false);
      launch(false, false);
      setTimeout(function () { launch(true, false); }, 150);
      setTimeout(function () { launch(false, false); }, 280);
      requestAnimationFrame(tick);

      loadSale();
      setInterval(loadSale, POLL_MS);
      setTimeout(function () { location.reload(); }, RELOAD_MS);
    })();
  </script>
</body>
</html>
